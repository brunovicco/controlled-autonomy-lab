[project]
name = "controlled-autonomy-lab"
version = "0.2.0"
description = "Compare increasing levels of LLM autonomy on the same incident-analysis task"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "governed-llm-gateway-client",
    "governed-llm-gateway-contracts",
]

[tool.uv.sources]
governed-llm-gateway-client = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "dfcc937e033aa92aa4ac063d47a395ea63355439", subdirectory = "packages/gateway-client" }
governed-llm-gateway-contracts = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "dfcc937e033aa92aa4ac063d47a395ea63355439", subdirectory = "packages/gateway-contracts" }

[project.scripts]
autonomy-lab = "autonomy_lab.cli:main"
autonomy-lab-epistemic-benchmark = "autonomy_lab.epistemic_benchmark_cli:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomy_lab"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ANN",
    "D",
    "S",
]
ignore = [
    "ANN401",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ANN"]
"scripts/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/autonomy_lab --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: tests that require real infrastructure",
    "contract: tests that verify an interface contract",
    "e2e: critical end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src/autonomy_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
test-roots = ["tests"]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
