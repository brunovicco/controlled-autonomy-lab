name: Apply multi-incident smoke hardening

on:
  push:
    branches:
      - feat/multiple-incident-fixtures-v3-2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/multiple-incident-fixtures-v3-2
      - name: Apply deterministic smoke regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          grounding_path = Path("src/autonomy_lab/application/grounding.py")
          grounding = grounding_path.read_text()

          grounding = replace_once(
              grounding,
              '_SCALAR_TIME_RE = re.compile(r"(?P<number>\\d+(?:\\.\\d+)?)(?P<unit>ms|s)$")\n',
              '_SCALAR_TIME_RE = re.compile(r"(?P<number>\\d+(?:\\.\\d+)?)(?P<unit>ms|s)$")\n'
              '_HTTP_STATUS_PLURAL_RE = re.compile(r"^[1-5]\\d{2}s$", re.IGNORECASE)\n'
              '_WORD_DURATION_RE = re.compile(\n'
              '    r"\\b(?P<number>one|two|three|four|five|six|seven|eight|nine|ten)\\s+"\n'
              '    r"(?P<unit>seconds?|secs?|minutes?|mins?|hours?|hrs?)\\b",\n'
              '    re.IGNORECASE,\n'
              ')\n'
              '_WORD_NUMBERS = {\n'
              '    "one": "1",\n'
              '    "two": "2",\n'
              '    "three": "3",\n'
              '    "four": "4",\n'
              '    "five": "5",\n'
              '    "six": "6",\n'
              '    "seven": "7",\n'
              '    "eight": "8",\n'
              '    "nine": "9",\n'
              '    "ten": "10",\n'
              '}\n',
              label="measurement constants",
          )

          grounding = replace_once(
              grounding,
              '_CAUSAL_REJECTION_RE = re.compile(\n'
              '    r"\\b(?:avoid\\s+(?:treat(?:ing)?|assum(?:e|ing)|claim(?:ing)?|conclud(?:e|ing))|"\n'
              '    r"(?:do\\s+not|don\'t|never)\\s+(?:treat|assume|claim|conclude)|"\n'
              '    r"before\\s+(?:declaring|claiming|concluding))\\b",\n'
              '    re.IGNORECASE,\n'
              ')\n',
              '_CAUSAL_REJECTION_RE = re.compile(\n'
              '    r"\\b(?:avoid\\s+(?:treat(?:ing)?|assum(?:e|ing)|claim(?:ing)?|conclud(?:e|ing))|"\n'
              '    r"(?:do\\s+not|don\'t|never)\\s+(?:treat|assume|claim|conclude)|"\n'
              '    r"before\\s+(?:declaring|claiming|concluding)|"\n'
              '    r"no\\s+causal\\s+conclusion|"\n'
              '    r"(?:does\\s+not|doesn\'t)\\s+change\\b.{0,80}\\broot\\s+cause|"\n'
              '    r"(?:unrelated|irrelevant)\\b.{0,80}\\broot\\s+cause)\\b",\n'
              '    re.IGNORECASE,\n'
              ')\n'
              '_CAUSAL_METHOD_RE = re.compile(\n'
              '    r"\\b(?:standard\\s+bar|can\\s+establish|method(?:ology)?)\\b",\n'
              '    re.IGNORECASE,\n'
              ')\n',
              label="causal rejection",
          )

          grounding = replace_once(
              grounding,
              '    r"suggests?\\b|if\\b|alternatively|correlation|not proven|no confirmed|not confirmed|"\n'
              '    r"unconfirmed|no evidence|cannot|can\'t|uncertain\\w*|unknown|assuming|would confirm|"\n',
              '    r"suggests?\\b|if\\b|alternatively|correlation|not proven|no confirmed|not confirmed|"\n'
              '    r"no\\s+(?:single\\s+)?confirmed|unconfirmed|no evidence|not independently|cannot|"\n'
              '    r"can\'t|uncertain\\w*|unknown|assuming|would confirm|"\n',
              label="uncertainty expressions",
          )

          grounding = replace_once(
              grounding,
              'def _measurement_matches(text: str) -> Iterator[re.Match[str]]:\n'
              '    """Yield measurements while excluding spans that overlap timestamp tokens."""\n'
              '    time_spans = tuple((match.start(), match.end()) for match in _TIME_RE.finditer(text))\n'
              '    for match in _MEASUREMENT_RE.finditer(text):\n'
              '        if any(match.start() < end and match.end() > start for start, end in time_spans):\n'
              '            continue\n'
              '        yield match\n',
              'def _measurement_matches(text: str) -> Iterator[re.Match[str]]:\n'
              '    """Yield measurements while excluding timestamps and HTTP-status plurals."""\n'
              '    time_spans = tuple((match.start(), match.end()) for match in _TIME_RE.finditer(text))\n'
              '    for match in _MEASUREMENT_RE.finditer(text):\n'
              '        if any(match.start() < end and match.end() > start for start, end in time_spans):\n'
              '            continue\n'
              '        if _HTTP_STATUS_PLURAL_RE.fullmatch(match.group().replace(" ", "")):\n'
              '            continue\n'
              '        yield match\n',
              label="measurement matcher",
          )

          grounding = replace_once(
              grounding,
              'def _context_for(text: str, start: int, end: int) -> str:\n',
              'def _reference_word_duration_measurements(reference: str) -> set[str]:\n'
              '    """Normalize small spelled-out fixture durations for deterministic equivalence."""\n'
              '    supported: set[str] = set()\n'
              '    for match in _WORD_DURATION_RE.finditer(reference):\n'
              '        number = _WORD_NUMBERS[match.group("number").lower()]\n'
              '        supported.add(_normalize_measurement(f"{number} {match.group(\'unit\')}"))\n'
              '    return supported\n'
              '\n'
              '\n'
              'def _context_for(text: str, start: int, end: int) -> str:\n',
              label="word duration helper",
          )

          old_assoc = '''def _reference_time_measurement_associations(reference: str) -> set[tuple[str, str]]:\n    """Extract exact timestamp-to-measurement pairs encoded by the fixture."""\n    associations: set[tuple[str, str]] = set()\n    for segment in re.split(r",\\s*|\\.\\s+", reference):\n        if "=" not in segment:\n            continue\n        times = list(_TIME_RE.finditer(segment))\n        measurements = list(_measurement_matches(segment))\n        if len(times) != 1 or len(measurements) != 1:\n            continue\n        associations.add(\n            (\n                _normalize_time(times[0].group()),\n                _normalize_measurement(measurements[0].group()),\n            )\n        )\n    return associations\n'''
          new_assoc = '''def _reference_time_measurement_associations(reference: str) -> set[tuple[str, str]]:\n    """Extract exact and locally explicit timestamp-to-measurement fixture relations."""\n    associations: set[tuple[str, str]] = set()\n    for segment in re.split(r",\\s*|\\.\\s+", reference):\n        if "=" not in segment:\n            continue\n        times = list(_TIME_RE.finditer(segment))\n        measurements = list(_measurement_matches(segment))\n        if len(times) != 1 or len(measurements) != 1:\n            continue\n        associations.add(\n            (\n                _normalize_time(times[0].group()),\n                _normalize_measurement(measurements[0].group()),\n            )\n        )\n\n    for sentence in re.split(r"\\.\\s+", reference):\n        times = list(_TIME_RE.finditer(sentence))\n        if len(times) != 1:\n            continue\n        timestamp = _normalize_time(times[0].group())\n        for measurement in _measurement_matches(sentence):\n            associations.add((timestamp, _normalize_measurement(measurement.group())))\n    return associations\n'''
          grounding = replace_once(grounding, old_assoc, new_assoc, label="association extraction")

          grounding = replace_once(
              grounding,
              '        supported_measurements = {\n'
              '            _normalize_measurement(item.group()) for item in _measurement_matches(reference)\n'
              '        }\n',
              '        supported_measurements = {\n'
              '            _normalize_measurement(item.group()) for item in _measurement_matches(reference)\n'
              '        }\n'
              '        supported_measurements.update(_reference_word_duration_measurements(reference))\n',
              label="supported duration set",
          )

          grounding = replace_once(
              grounding,
              '                or _CAUSAL_REJECTION_RE.search(line)\n'
              '                or section_is_qualified\n',
              '                or _CAUSAL_REJECTION_RE.search(line)\n'
              '                or _CAUSAL_METHOD_RE.search(line)\n'
              '                or section_is_qualified\n',
              label="causal methodology",
          )

          grounding_path.write_text(grounding)

          incidents_path = Path("src/autonomy_lab/adapters/incidents.py")
          incidents = incidents_path.read_text()
          incidents = replace_once(
              incidents,
              '"from 3s to 800ms. Rollback at 09:24 restored the prior timeout and recovery "\n',
              '"from 3s to 800ms. Rollback at 09:24 restored the prior 3s timeout and recovery "\n',
              label="rollback evidence",
          )
          incidents_path.write_text(incidents)

          claims_path = Path("src/autonomy_lab/application/claim_evaluation.py")
          claims = claims_path.read_text()
          claims = replace_once(
              claims,
              '_SENTENCE_BOUNDARY_RE = re.compile(r"(?<=[.!?])\\s+(?=[A-Z0-9`*])")\n',
              '_SENTENCE_BOUNDARY_RE = re.compile(r"(?<=[.!?])\\s+(?=[A-Z0-9`*])")\n'
              '_MARKDOWN_TABLE_SEPARATOR_CELL_RE = re.compile(r"^:?-{3,}:?$")\n',
              label="claim table constant",
          )
          claims = replace_once(
              claims,
              '_EPISTEMIC_INFERENCE_RE = re.compile(\n'
              '    r"^(?:no confirmed|not confirmed|unconfirmed|no evidence)\\b",\n',
              '_EPISTEMIC_INFERENCE_RE = re.compile(\n'
              '    r"^(?:no(?:\\s+single)?\\s+confirmed|not confirmed|unconfirmed|no evidence|"\n'
              '    r"no causal conclusion)\\b",\n',
              label="epistemic inference",
          )

          old_extract = '''def _extract_claims(answer: str) -> tuple[_ClaimCandidate, ...]:\n    """Extract non-heading, non-empty sentence-like claims while retaining section context."""\n    heading = ""\n    claims: list[_ClaimCandidate] = []\n    for raw_line in answer.splitlines():\n        stripped = raw_line.strip()\n        if not stripped:\n            continue\n        title = _heading_title(stripped)\n        if title is not None:\n            heading = title\n            continue\n        list_item = _LIST_PREFIX_RE.match(stripped) is not None\n        content = _LIST_PREFIX_RE.sub("", stripped).strip()\n        if not content:\n            continue\n        for sentence in _SENTENCE_BOUNDARY_RE.split(content):\n            claim = sentence.strip()\n            if claim:\n                claims.append(\n                    _ClaimCandidate(\n                        text=claim,\n                        heading=heading,\n                        list_item=list_item,\n                    )\n                )\n    return tuple(claims)\n'''
          new_extract = '''def _is_markdown_table_separator(line: str) -> bool:\n    if not (line.startswith("|") and line.endswith("|")):\n        return False\n    cells = [cell.strip() for cell in line.strip("|").split("|")]\n    return bool(cells) and all(_MARKDOWN_TABLE_SEPARATOR_CELL_RE.fullmatch(cell) for cell in cells)\n\n\ndef _extract_claims(answer: str) -> tuple[_ClaimCandidate, ...]:\n    """Extract non-heading, non-empty sentence-like claims while retaining section context."""\n    heading = ""\n    claims: list[_ClaimCandidate] = []\n    lines = answer.splitlines()\n    for index, raw_line in enumerate(lines):\n        stripped = raw_line.strip()\n        if not stripped:\n            continue\n        title = _heading_title(stripped)\n        if title is not None:\n            heading = title\n            continue\n        if _is_markdown_table_separator(stripped):\n            continue\n        if (\n            stripped.startswith("|")\n            and stripped.endswith("|")\n            and index + 1 < len(lines)\n            and _is_markdown_table_separator(lines[index + 1].strip())\n        ):\n            continue\n        list_item = _LIST_PREFIX_RE.match(stripped) is not None\n        content = _LIST_PREFIX_RE.sub("", stripped).strip()\n        if not content:\n            continue\n        if content.endswith(":") and _HYPOTHESIS_HEADING_RE.search(content):\n            heading = content.removesuffix(":").strip()\n            continue\n        for sentence in _SENTENCE_BOUNDARY_RE.split(content):\n            claim = sentence.strip()\n            if claim:\n                claims.append(\n                    _ClaimCandidate(\n                        text=claim,\n                        heading=heading,\n                        list_item=list_item,\n                    )\n                )\n    return tuple(claims)\n'''
          claims = replace_once(claims, old_extract, new_extract, label="claim extraction")
          claims_path.write_text(claims)

          tests_path = Path("tests/unit/test_multiple_incidents.py")
          tests = tests_path.read_text()
          tests += '''\n\ndef test_inc002_live_timeline_associations_are_supported() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-002")\n    evidence = store.get_evidence(incident)\n    answer = """| Time | Event |\n|---|---|\n| 09:05 | Baseline: error rate 0.3%, p95 latency 290ms |\n| 09:08 | Deploy of v2.19.1; timeout reduced from 3s to 800ms |\n| 09:24 | Rollback of v2.19.1; timeout restored to 3s |\n"""\n\n    report = DeterministicGroundingEvaluator().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n\n    assert report.unsupported_specifics == ()\n\n\ndef test_http_status_plural_is_not_parsed_as_seconds() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-003")\n    evidence = store.get_evidence(incident)\n\n    report = DeterministicGroundingEvaluator().evaluate(\n        answer="payments-api 503s begin climbing during the incident.",\n        incident=incident,\n        evidence=evidence,\n    )\n\n    assert report.unsupported_specifics == ()\n\n\ndef test_spelled_out_fixture_durations_support_numeric_paraphrases() -> None:\n    store = InMemoryIncidentStore()\n\n    inc003 = store.get_incident("INC-003")\n    report003 = DeterministicGroundingEvaluator().evaluate(\n        answer="No deployment or config change occurred in the 6 hours prior.",\n        incident=inc003,\n        evidence=store.get_evidence(inc003),\n    )\n    assert report003.unsupported_specifics == ()\n\n    inc004 = store.get_incident("INC-004")\n    report004 = DeterministicGroundingEvaluator().evaluate(\n        answer="The last deploy was nearly ~3 hrs before the incident.",\n        incident=inc004,\n        evidence=store.get_evidence(inc004),\n    )\n    assert report004.unsupported_specifics == ()\n\n\ndef test_confirmed_cause_meta_references_are_not_overclaims() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-002")\n    evidence = store.get_evidence(incident)\n    answer = (\n        "That's a process gap worth reviewing but doesn't change the technical root cause. "\n        "INC-901 is unrelated and irrelevant to this root cause."\n    )\n\n    report = DeterministicGroundingEvaluator().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n\n    assert report.causality_overclaims == ()\n\n\ndef test_methodology_and_reported_confirmation_are_not_overclaims() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-003")\n    evidence = store.get_evidence(incident)\n    answer = (\n        "The runbook describes the standard bar for establishing dependency-caused failure. "\n        "I'm treating root cause confirmed as reported by the dependency system, "\n        "not independently re-derived from raw logs."\n    )\n\n    report = DeterministicGroundingEvaluator().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n\n    assert report.causality_overclaims == ()\n\n\ndef test_inconclusive_smoke_language_preserves_abstention() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-004")\n    evidence = store.get_evidence(incident)\n    answer = (\n        "No single confirmed root cause yet. "\n        "No causal conclusion should be drawn yet before attributing root cause."\n    )\n\n    grounding = DeterministicGroundingEvaluator().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n    claims = DeterministicClaimEvaluatorV2().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n\n    assert grounding.causality_overclaims == ()\n    assert grounding.uncertainty_preserved is True\n    assert all(item.kind is ClaimKind.SUPPORTED_INFERENCE for item in claims.claims)\n\n\ndef test_claim_extraction_skips_markdown_table_structure_and_hypothesis_label() -> None:\n    store = InMemoryIncidentStore()\n    incident = store.get_incident("INC-004")\n    evidence = store.get_evidence(incident)\n    answer = """| Time | Event |\n|---|---|\n| 11:20 | p95 latency reached 920ms |\n\nTwo plausible, unconfirmed hypotheses:\n1. The identity-provider may be a partial contributor.\n"""\n\n    report = DeterministicClaimEvaluatorV2().evaluate(\n        answer=answer,\n        incident=incident,\n        evidence=evidence,\n    )\n    texts = {item.claim for item in report.claims}\n\n    assert "| Time | Event |" not in texts\n    assert "|---|---|" not in texts\n    assert "Two plausible, unconfirmed hypotheses:" not in texts\n'''
          tests_path.write_text(tests)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy_lab/application/grounding.py \
                  src/autonomy_lab/application/claim_evaluation.py \
                  src/autonomy_lab/adapters/incidents.py \
                  tests/unit/test_multiple_incidents.py
          git commit -m "fix: harden evaluators from multi-incident smokes"
          git push origin HEAD:feat/multiple-incident-fixtures-v3-2
