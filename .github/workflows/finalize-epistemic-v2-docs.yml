name: finalize-epistemic-v2-docs

on:
  push:
    branches:
      - docs/epistemic-v2-evidence

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply documentation updates
        run: python scripts/finalize_epistemic_v2_docs.py
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/EPISTEMIC_GENERATION_V2_RESULTS.md
          git diff --cached --check
          git commit -m "docs: surface epistemic v2 evidence"
          git push origin HEAD:docs/epistemic-v2-evidence
