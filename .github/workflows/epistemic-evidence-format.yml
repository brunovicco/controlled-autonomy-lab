name: epistemic-evidence-format

on:
  push:
    branches:
      - docs/epistemic-v2-evidence

permissions:
  contents: write

jobs:
  format-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Apply known lint fixes
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_epistemic_v2_evidence_pack.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    if row.get("status") != "ok":\n'
              '        if row.get("epistemic_verdict") is not None or row.get("epistemic_aligned") is not None:\n'
              '            raise ValueError("non-OK record contains epistemic quality verdict")\n',
              '    if row.get("status") != "ok" and (\n'
              '        row.get("epistemic_verdict") is not None\n'
              '        or row.get("epistemic_aligned") is not None\n'
              '    ):\n'
              '        raise ValueError("non-OK record contains epistemic quality verdict")\n',
          )
          text = text.replace(
              '            raise ValueError(f"{provider}/{incident}: expected 6 records, found {len(incident_rows)}")\n',
              '            raise ValueError(\n'
              '                f"{provider}/{incident}: expected 6 records, found {len(incident_rows)}"\n'
              '            )\n',
          )
          text = text.replace("×", "x")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and validate builder
        run: |
          uv run ruff format scripts/build_epistemic_v2_evidence_pack.py
          uv run ruff check scripts/build_epistemic_v2_evidence_pack.py
      - name: Commit formatter changes
        run: |
          if git diff --quiet -- scripts/build_epistemic_v2_evidence_pack.py; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_epistemic_v2_evidence_pack.py
          git commit -m "style: format epistemic evidence builder"
          git push origin HEAD:docs/epistemic-v2-evidence
