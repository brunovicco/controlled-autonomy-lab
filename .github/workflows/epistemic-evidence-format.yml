name: epistemic-evidence-format

on:
  push:
    branches:
      - docs/epistemic-v2-evidence

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Ruff formatter diff
        run: uv run ruff format --diff scripts/build_epistemic_v2_evidence_pack.py
        continue-on-error: true
