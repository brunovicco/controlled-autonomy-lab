name: format-debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Show Ruff formatting diff
        run: |
          uv run ruff format src/autonomy_lab/application/epistemic.py
          git diff -- src/autonomy_lab/application/epistemic.py
