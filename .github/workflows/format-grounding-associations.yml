name: format-grounding-associations

on:
  push:
    branches:
      - feat/grounding-evaluation-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/grounding-evaluation-v1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format src/autonomy_lab/application/grounding.py
      - run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy_lab/application/grounding.py
          git commit -m "style: format grounding associations"
          git push origin HEAD:feat/grounding-evaluation-v1
