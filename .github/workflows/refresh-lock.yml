name: Refresh project lock

on:
  push:
    branches:
      - case/controlled-autonomy-lab

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case/controlled-autonomy-lab

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Regenerate lock
        run: uv lock

      - name: Commit lock if changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh lock after scaffold cleanup"
          git push origin HEAD:case/controlled-autonomy-lab
