name: Apply breadth benchmark patch

on:
  push:
    branches:
      - feat/multi-incident-breadth-benchmark-v3-3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/multi-incident-breadth-benchmark-v3-3
      - name: Preserve generated string escapes
        run: python -c "from pathlib import Path; p=Path('scripts/apply_breadth_patch.py'); s=p.read_text(); p.write_text(s.replace(\"breadth = '''\", \"breadth = r'''\", 1))"
      - name: Apply patch
        run: python scripts/apply_breadth_patch.py
      - name: Install Ruff
        run: python -m pip install ruff==0.15.22
      - name: Format patch
        run: |
          ruff format src/autonomy_lab/cli.py tests/unit/test_benchmark_cli.py
          ruff check --fix src/autonomy_lab/cli.py tests/unit/test_benchmark_cli.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy_lab/cli.py tests/unit/test_benchmark_cli.py docs/MULTI_INCIDENT_BREADTH_BENCHMARK.md
          git commit -m "feat: add multi-incident breadth benchmark mode"
          git push origin HEAD:feat/multi-incident-breadth-benchmark-v3-3
