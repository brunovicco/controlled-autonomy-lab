name: Apply claim replay formatter

on:
  push:
    branches:
      - feat/multiple-incident-fixtures-v3-2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/multiple-incident-fixtures-v3-2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.28
      - run: uv sync --frozen --all-groups
      - name: Format replay test
        run: uv run ruff format tests/unit/test_multi_incident_claim_replay.py
      - name: Commit formatter output
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_multi_incident_claim_replay.py
          git commit -m "style: format claim replay regressions"
          git push origin HEAD:feat/multiple-incident-fixtures-v3-2
