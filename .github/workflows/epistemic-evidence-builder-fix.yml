name: epistemic-evidence-builder-fix

on:
  push:
    branches:
      - docs/epistemic-v2-evidence

permissions:
  contents: write

jobs:
  fix-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Apply summary schema fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_epistemic_v2_evidence_pack.py")
          text = path.read_text()
          text = text.replace(
              'def _summary_row(label: str, rows: Sequence[Mapping[str, Any]]) -> dict[str, Any]:',
              'def _summary_row(rows: Sequence[Mapping[str, Any]]) -> dict[str, Any]:',
          )
          text = text.replace('        "group": label,\n', '')
          text = text.replace(
              '        summary = _summary_row(" / ".join(key), group)\n',
              '        summary = _summary_row(group)\n',
          )
          path.write_text(text)
          PY
      - name: Validate focused regression
        run: |
          uv run ruff check scripts/build_epistemic_v2_evidence_pack.py tests/unit/test_epistemic_evidence_builder.py
          uv run ruff format --check scripts/build_epistemic_v2_evidence_pack.py tests/unit/test_epistemic_evidence_builder.py
          uv run pytest -q -o addopts='' tests/unit/test_epistemic_evidence_builder.py
      - name: Commit builder fix
        run: |
          if git diff --quiet -- scripts/build_epistemic_v2_evidence_pack.py; then
            echo "No builder changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_epistemic_v2_evidence_pack.py
          git commit -m "fix: align epistemic evidence summary schema"
          git push origin HEAD:docs/epistemic-v2-evidence
