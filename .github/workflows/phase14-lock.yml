name: phase14-lock

on:
  push:
    branches: [feat/governed-gateway-integration]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/governed-gateway-integration
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - run: uv python install
      - name: Regenerate and validate lock
        run: |
          uv lock
          uv lock --check
          uv sync --frozen --all-groups
      - name: Commit lock and remove one-shot workflow
        run: |
          rm .github/workflows/phase14-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock .github/workflows/phase14-lock.yml
          git commit -m "build: lock governed gateway integration"
          git push origin HEAD:feat/governed-gateway-integration
