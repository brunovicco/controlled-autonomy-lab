name: format-grounding

on:
  push:
    branches:
      - feat/grounding-evaluation-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/grounding-evaluation-v1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format src/autonomy_lab/application/grounding.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy_lab/application/grounding.py
          git commit -m "style: format grounding evaluator"
          git push origin HEAD:feat/grounding-evaluation-v1
