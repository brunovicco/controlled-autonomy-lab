name: patch-grounding-compare

on:
  push:
    branches:
      - feat/grounding-evaluation-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/grounding-evaluation-v1
      - name: Patch CLI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/autonomy_lab/cli.py")
          text = path.read_text()

          text = text.replace(
              "from autonomy_lab.adapters.incidents import InMemoryIncidentStore\n",
              "from autonomy_lab.adapters.anthropic import ModelProviderError as AnthropicProviderError\n"
              "from autonomy_lab.adapters.incidents import InMemoryIncidentStore\n",
              1,
          )
          text = text.replace(
              "from autonomy_lab.application.model_ports import ModelClient\n",
              "from autonomy_lab.application.model_errors import ModelProviderError, ModelRateLimitError\n"
              "from autonomy_lab.application.model_ports import ModelClient\n",
              1,
          )
          text = text.replace(
              "from autonomy_lab.domain.grounding import GroundingReport\n",
              "from autonomy_lab.domain.grounding import GroundingFinding, GroundingReport\n",
              1,
          )

          start = text.index("def _grounding_payload(")
          end = text.index("\n\ndef _run_payload", start)
          payload_helpers = '''def _findings_payload(
              findings: tuple[GroundingFinding, ...],
          ) -> list[dict[str, object]]:
              return [
                  {
                      "kind": finding.kind.value,
                      "value": finding.value,
                      "context": finding.context,
                  }
                  for finding in findings
              ]


          def _grounding_payload(report: GroundingReport) -> dict[str, object]:
              return {
                  "supported_specifics": list(report.supported_specifics),
                  "unsupported_specifics": _findings_payload(report.unsupported_specifics),
                  "proposed_specifics": _findings_payload(report.proposed_specifics),
                  "causality_overclaims": _findings_payload(report.causality_overclaims),
                  "uncertainty_preserved": report.uncertainty_preserved,
                  "specific_grounding_ratio": round(report.specific_grounding_ratio, 4),
              }
          '''
          text = text[:start] + payload_helpers.rstrip() + text[end:]

          text = text.replace(
              '    print(f"unsupported specifics: {report.unsupported_count}")\n',
              '    print(f"unsupported specifics: {report.unsupported_count}")\n'
              '    print(f"proposed parameters:   {report.proposed_count}")\n',
              1,
          )
          text = text.replace(
              "    for finding in (*report.unsupported_specifics, *report.causality_overclaims):\n",
              "    for finding in (\n"
              "        *report.unsupported_specifics,\n"
              "        *report.proposed_specifics,\n"
              "        *report.causality_overclaims,\n"
              "    ):\n",
              1,
          )

          main_marker = "\ndef main(argv: Sequence[str] | None = None) -> int:\n"
          helper = '''

          def _print_compare_failure(pattern: AutonomyPattern, status: str) -> None:
              print(f"{pattern.value} | - | - | - | - | - | - | - | - | - | {status}")
          '''
          text = text.replace(main_marker, helper.rstrip() + main_marker, 1)

          compare_start = text.index('    if args.command == "compare":')
          compare_end = text.index("\n    pattern = AutonomyPattern(args.pattern)", compare_start)
          compare_block = '''    if args.command == "compare":
              evaluator = DeterministicGroundingEvaluator()
              had_provider_errors = False
              print(
                  "pattern | model_calls | tool_calls | input_tokens | output_tokens | latency_ms | "
                  "unsupported | proposed | causality | uncertainty | status"
              )
              print("-" * 145)
              for pattern in AutonomyPattern:
                  try:
                      run = _build_runner(pattern, store=store, model=model).run(args.incident)
                  except ModelRateLimitError:
                      had_provider_errors = True
                      _print_compare_failure(pattern, "rate_limited")
                      continue
                  except (ModelProviderError, AnthropicProviderError):
                      had_provider_errors = True
                      _print_compare_failure(pattern, "provider_error")
                      continue
                  _record_if_requested(run, args.trace_file)
                  grounding = _grounding_for_run(run, store=store, evaluator=evaluator)
                  uncertainty = "yes" if grounding.uncertainty_preserved else "no"
                  print(
                      f"{pattern.value} | {run.model_calls} | {run.tool_calls} | "
                      f"{run.usage.input_tokens} | {run.usage.output_tokens} | {run.latency_ms:.1f} | "
                      f"{grounding.unsupported_count} | {grounding.proposed_count} | "
                      f"{grounding.causality_overclaim_count} | {uncertainty} | ok"
                  )
              return 2 if had_provider_errors else 0
          '''
          text = text[:compare_start] + compare_block.rstrip() + text[compare_end:]
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy_lab/cli.py
          git commit -m "feat: make compare fail soft on provider limits"
          git push origin HEAD:feat/grounding-evaluation-v1
